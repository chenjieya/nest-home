name: Build & Deploy

on:
  push:
    branches: [main]
  workflow_dispatch:

env:
  IMAGE: ghcr.io/${{ github.repository_owner }}/nest-home
  WEATHER_IMAGE: ghcr.io/${{ github.repository_owner }}/nest-weather
  DEPLOY_DIR: ${{ vars.DEPLOY_DIR || '/home/alvis/nest-home' }}

concurrency:
  group: nest-production
  cancel-in-progress: false

jobs:
  test:
    if: github.ref == 'refs/heads/main'
    runs-on: ubuntu-latest
    permissions:
      contents: read
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: "22"
      - name: 天气接口、备用切换和配额测试
        run: npm test --prefix services/weather

  # 1. 分别构建主页和独立天气服务，不向 CI 提供天气 Key。
  build:
    needs: test
    if: github.ref == 'refs/heads/main'
    runs-on: ubuntu-latest
    strategy:
      matrix:
        include:
          - image: nest-home
            context: .
          - image: nest-weather
            context: ./services/weather
    permissions:
      contents: read
      packages: write
    steps:
      - uses: actions/checkout@v4
      - uses: docker/setup-buildx-action@v3

      - name: 登录 GHCR
        uses: docker/login-action@v3
        with:
          registry: ghcr.io
          username: ${{ github.actor }}
          password: ${{ secrets.GITHUB_TOKEN }}

      - name: 构建并推送
        uses: docker/build-push-action@v6
        with:
          context: ${{ matrix.context }}
          push: true
          platforms: linux/amd64
          tags: |
            ghcr.io/${{ github.repository_owner }}/${{ matrix.image }}:latest
            ghcr.io/${{ github.repository_owner }}/${{ matrix.image }}:${{ github.sha }}
          labels: |
            org.opencontainers.image.source=https://github.com/${{ github.repository }}
            org.opencontainers.image.revision=${{ github.sha }}
          cache-from: type=gha,scope=${{ matrix.image }}
          cache-to: type=gha,mode=max,scope=${{ matrix.image }}

  # 2. SSH 密钥登录，上传 Compose 并更新容器。
  deploy:
    needs: build
    runs-on: ubuntu-latest
    permissions:
      contents: read
      packages: read
    steps:
      - uses: actions/checkout@v4

      - name: 检查部署凭据
        id: guard
        env:
          SSH_HOST: ${{ secrets.SSH_HOST }}
          SSH_USER: ${{ secrets.SSH_USER }}
          SSH_PRIVATE_KEY: ${{ secrets.SSH_PRIVATE_KEY }}
        run: |
          if [ -z "$SSH_HOST" ] || [ -z "$SSH_USER" ] || [ -z "$SSH_PRIVATE_KEY" ]; then
            echo "::warning::未配置 SSH_HOST / SSH_USER / SSH_PRIVATE_KEY，跳过部署（镜像已推送）"
            echo "skip=true" >> "$GITHUB_OUTPUT"
          else
            echo "skip=false" >> "$GITHUB_OUTPUT"
          fi

      - name: 上传 Compose 文件
        if: steps.guard.outputs.skip == 'false'
        uses: appleboy/scp-action@v0.1.7
        with:
          host: ${{ secrets.SSH_HOST }}
          username: ${{ secrets.SSH_USER }}
          key: ${{ secrets.SSH_PRIVATE_KEY }}
          port: ${{ secrets.SSH_PORT || 22 }}
          source: docker-compose.yml,services/weather/.env.example
          target: ${{ env.DEPLOY_DIR }}

      - name: 远程拉取并启动
        if: steps.guard.outputs.skip == 'false'
        uses: appleboy/ssh-action@v1.0.3
        env:
          IMAGE: ${{ env.IMAGE }}:${{ github.sha }}
          WEATHER_IMAGE: ${{ env.WEATHER_IMAGE }}:${{ github.sha }}
          DEPLOY_DIR: ${{ env.DEPLOY_DIR }}
          GHCR_USER: ${{ github.actor }}
          GHCR_TOKEN: ${{ secrets.GITHUB_TOKEN }}
        with:
          host: ${{ secrets.SSH_HOST }}
          username: ${{ secrets.SSH_USER }}
          key: ${{ secrets.SSH_PRIVATE_KEY }}
          port: ${{ secrets.SSH_PORT || 22 }}
          command_timeout: 15m
          envs: IMAGE,WEATHER_IMAGE,DEPLOY_DIR,GHCR_USER,GHCR_TOKEN
          script: |
            set -eu
            cd "$DEPLOY_DIR"
            if [ ! -f .env.weather ]; then
              echo '请先在服务器部署目录创建 .env.weather，参考 services/weather/.env.example 并填写 AMAP_KEY'
              exit 1
            fi
            # 登录信息只写入本次部署的临时目录。
            export DOCKER_CONFIG=$(mktemp -d)
            trap 'rm -rf "$DOCKER_CONFIG"' EXIT
            printf '%s' "$GHCR_TOKEN" | docker login ghcr.io -u "$GHCR_USER" --password-stdin
            export IMAGE WEATHER_IMAGE
            docker compose pull app weather
            if ! docker compose up -d --no-build --wait --wait-timeout 90 app weather; then
              docker compose logs --tail 50 app weather
              exit 1
            fi
            # 保存部署的镜像版本，便于之后手动执行同一份 Compose。
            printf 'IMAGE=%s\nWEATHER_IMAGE=%s\n' "$IMAGE" "$WEATHER_IMAGE" > .deploy.env
            for i in $(seq 1 10); do
              if curl -fsS --max-time 5 http://127.0.0.1:8000/ -o /dev/null && \
                 curl -fsS --max-time 5 http://127.0.0.1:8000/api/weather/health -o /dev/null; then
                echo '部署成功：https://nest.alvis.org.cn'
                exit 0
              fi
              sleep 3
            done
            docker compose logs --tail 50 app weather
            exit 1
